
name: Build LEZAR STORE APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project ZIP
        run: unzip -o LEZAR_STORE_project.zip

      - name: Find project and align Java and Kotlin
        id: setup
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$APP_GRADLE" ]; then
            echo "App Gradle file not found: $APP_GRADLE"
            exit 1
          fi

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_GRADLE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$APP_GRADLE"
          sed -i 's/jvmTarget = '\''1.8'\''/jvmTarget = '\''17'\''/g' "$APP_GRADLE"

      - name: Build debug APK
        run: gradle -p "${{ steps.setup.outputs.project_dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEZAR-STORE-debug-apk
          path: ${{ steps.setup.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
