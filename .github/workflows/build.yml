name: Build LEZAR STORE APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project ZIP
        run: unzip -o LEZAR_STORE_project.zip

      - name: Find project and fix JVM targets
        id: setup
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: App Gradle file not found: $APP_GRADLE"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          cat >> "$APP_GRADLE" <<'GRADLE'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          GRADLE

      - name: Build debug APK
        run: gradle -p "${{ steps.setup.outputs.project_dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEZAR-STORE-debug-apk
          path: ${{ steps.setup.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
